<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>leather-nest — match skins</title>
  </head>
  <body>
    <h1>Skin inventory &amp; matching</h1>

    <section>
      <h2>Add a skin</h2>
      <p>Upload a photo, click two points on a ruler for calibration, drag a rectangle over the sample panel area, then label it.</p>
      <input type="file" id="photo-input" accept="image/*" />
      <div id="calibration-container"></div>
      <div id="region-container"></div>
      <div id="add-form" style="display: none">
        <label>Label: <input type="text" id="label-input" /></label>
        <!-- A select, not free text: matching groups hides by their exact
             species string, so a typo here makes a hide that can never pair
             with anything. Options come from src/skins/species.js. -->
        <label>Species:
          <select id="species-input">
            <option value="">-- Choose species --</option>
          </select>
        </label>
        <!-- Everything this form creates is a signature capture, so a cut is
             always required here. Options from src/skins/cuts.js. -->
        <label>Cut:
          <select id="cut-input">
            <option value="">-- Choose cut --</option>
          </select>
        </label>
        <button type="button" id="submit-skin">Add to inventory</button>
      </div>
      <div id="add-status"></div>
    </section>

    <section>
      <h2>Inventory</h2>
      <button type="button" id="refresh-inventory">Refresh</button>
      <div id="inventory"></div>
    </section>

    <section>
      <h2>Matches</h2>
      <button type="button" id="refresh-matches">Find matches</button>
      <div id="matches"></div>
    </section>

    <script type="module" src="/src/match-skins-app.js"></script>
  </body>
</html>
