<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>leather-nest — jobs</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Figtree:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="/public/styles.css" />
    <style>
      .page { max-width: 1000px; margin: 0 auto; padding: var(--space-6) var(--space-4); }
      .jobs-header { margin-bottom: var(--space-4); }
      .job-grid {
        display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: var(--space-4);
      }
      .job-card img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: var(--radius-sm); }
      .job-card .card-title { display: flex; align-items: center; justify-content: space-between; gap: var(--space-2); }
      .job-actions { display: flex; gap: var(--space-2); margin-top: var(--space-2); }
    </style>
  </head>
  <body>
    <nav class="nav">
      <span class="nav-brand">leather-nest</span>
      <a href="/">Home</a>
      <a href="/public/hides.html">Hides</a>
      <a href="/public/dies.html">Components</a>
    </nav>

    <main class="page">
      <div class="jobs-header">
        <h1>Jobs</h1>
        <p class="text-muted" id="jobs-summary">Loading…</p>
      </div>
      <div class="job-grid" id="job-grid"></div>
    </main>

    <script type="module" src="/src/jobs-app.js"></script>
  </body>
</html>
